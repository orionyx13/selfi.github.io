<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Selfi Anggraeni</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .page-hero {
      padding: calc(var(--nav-h) + 64px) 0 64px;
      background: linear-gradient(135deg, var(--rose-pale) 0%, var(--cream) 60%);
      text-align: center;
    }
    .page-hero .section-eyebrow { justify-content: center; }
    .page-hero .section-eyebrow::before { display: none; }
    .gallery-full-section { padding: 64px 0 100px; background: var(--cream); }
    .gallery-count { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; text-align: right; }
    .nav-links a.nav-active { color: var(--rose); }
    .nav-links a.nav-active::after { width: 100%; }
    
    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20,10,8,0.92);
      z-index: 999;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lightbox-inner { position: relative; max-width: 900px; width: 100%; }
    .lightbox-img { width: 100%; max-height: 80vh; object-fit: contain; border-radius: 12px; }
    .lightbox-caption { text-align: center; margin-top: 16px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; color: rgba(255,255,255,0.7); }
    .lightbox-close { position: absolute; top: -48px; right: 0; background: none; border: none; color: rgba(255,255,255,0.7); font-size: 28px; cursor: pointer; }
    .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.12); border: none; color: white; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; }
    .lightbox-nav.prev { left: -60px; }
    .lightbox-nav.next { right: -60px; }
    @media (max-width: 768px) { .lightbox-nav.prev { left: 0; } .lightbox-nav.next { right: 0; } }
  </style>
</head>
<body>

  <nav id="navbar">
    <div class="nav-logo"><a href="index.html" style="color:inherit;text-decoration:none">fiiselfii <span>✦</span></a></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#biodata">Biodata</a></li>
      <li><a href="gallery.html" class="nav-active">Gallery</a></li>
      <li><a href="music.html">Music</a></li>
    </ul>
    <button class="nav-burger" id="navBurger"><span></span><span></span><span></span></button>
  </nav>

  <div class="page-hero">
    <div class="container">
      <p class="section-eyebrow">Visual Stories</p>
      <h1 class="section-title">My <em>Gallery</em></h1>
      <p>Semua momen yang ingin aku abadikan</p>
      <!-- FILTER TINGGAL ALL — tersembunyi atau cukup 1 tombol -->
      <div class="gallery-page-filters" style="display: none;"></div>
    </div>
  </div>

  <section class="gallery-full-section">
    <div class="container">
      <p class="gallery-count" id="galleryCount"></p>
      <div class="gallery-grid" id="galleryFull"></div>
    </div>
  </section>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-inner">
      <button class="lightbox-close" id="lightboxClose">✕</button>
      <button class="lightbox-nav prev" id="lightboxPrev">‹</button>
      <img class="lightbox-img" id="lightboxImg" src="" alt="" />
      <button class="lightbox-nav next" id="lightboxNext">›</button>
      <p class="lightbox-caption" id="lightboxCaption"></p>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <p class="footer-name">Selfi Anggraeni</p>
      <p class="footer-copy">Made with ♡ · 2026</p>
      <div class="footer-socials">
        <a href="#">Instagram</a><a href="#">TikTok</a><a href="#">WhatsApp</a>
      </div>
    </div>
  </footer>

  <script src="data.js"></script>
  <script>
    const galleryFull = document.getElementById("galleryFull");
    const galleryCount = document.getElementById("galleryCount");
    let semuaFoto = typeof PHOTOS !== 'undefined' ? [...PHOTOS] : [];
    let lightboxIdx = 0;

    function buildGallery(photos) {
      if (!galleryFull) return;
      galleryFull.innerHTML = "";
      if (galleryCount) galleryCount.textContent = photos.length + " foto";

      photos.forEach((p, idx) => {
        const div = document.createElement("div");
        div.className = "g-item";
        div.innerHTML = `
          <img src="${p.src}" alt="${p.caption}" style="width:100%; height:100%; object-fit:cover;" onerror="this.parentNode.classList.add('no-img')" />
          <div class="g-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" width="36" height="36">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
            <span>${p.caption}</span>
          </div>
          <div class="g-overlay"><span>${p.caption}</span></div>`;
        div.addEventListener("click", () => openLightbox(idx, photos));
        galleryFull.appendChild(div);
      });
    }

    function openLightbox(idx, photos) {
      lightboxIdx = idx;
      const lb = document.getElementById("lightbox");
      if (lb) lb.classList.add("open");
      updateLightbox(photos);
    }

    function updateLightbox(photos) {
      const p = photos[lightboxIdx];
      const imgEl = document.getElementById("lightboxImg");
      const capEl = document.getElementById("lightboxCaption");
      if (imgEl) imgEl.src = p.src;
      if (capEl) capEl.textContent = p.caption;
    }

    document.getElementById("lightboxClose")?.addEventListener("click", () => {
      document.getElementById("lightbox")?.classList.remove("open");
    });
    document.getElementById("lightboxPrev")?.addEventListener("click", () => {
      lightboxIdx = (lightboxIdx - 1 + semuaFoto.length) % semuaFoto.length;
      updateLightbox(semuaFoto);
    });
    document.getElementById("lightboxNext")?.addEventListener("click", () => {
      lightboxIdx = (lightboxIdx + 1) % semuaFoto.length;
      updateLightbox(semuaFoto);
    });
    document.getElementById("lightbox")?.addEventListener("click", (e) => {
      if (e.target === document.getElementById("lightbox")) document.getElementById("lightbox")?.classList.remove("open");
    });
    document.addEventListener("keydown", (e) => {
      const lb = document.getElementById("lightbox");
      if (!lb || !lb.classList.contains("open")) return;
      if (e.key === "Escape") lb.classList.remove("open");
      if (e.key === "ArrowLeft") { lightboxIdx = (lightboxIdx - 1 + semuaFoto.length) % semuaFoto.length; updateLightbox(semuaFoto); }
      if (e.key === "ArrowRight") { lightboxIdx = (lightboxIdx + 1) % semuaFoto.length; updateLightbox(semuaFoto); }
    });

    if (semuaFoto.length) {
      buildGallery(semuaFoto);
    } else {
      if (galleryCount) galleryCount.textContent = "0 foto";
      if (galleryFull) galleryFull.innerHTML = "<p style='text-align:center;'>Belum ada foto.</p>";
    }

    const burger = document.getElementById("navBurger");
    const navLinks = document.querySelector(".nav-links");
    if (burger && navLinks) {
      burger.addEventListener("click", () => navLinks.classList.toggle("open"));
    }
  </script>
</body>
</html>
